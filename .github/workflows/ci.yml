name: CI Pipeline

# Ejecutar el pipeline al hacer push o pull request en la rama 'main'
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # Paso 2: Configurar Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Paso 3: Ejecutar Maven para compilar y probar
      - name: Build and Test with Maven
        working-directory: ./devops-tcs # Ruta relativa a la carpeta del proyecto
        run: mvn clean package -DskipTests=false

  docker_build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:
      # Paso 1: Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # Paso 2: Iniciar sesión en Azure Container Registry
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: registrai.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Paso 3: Construir y subir la imagen Docker
      - name: Build and Push Docker Image
        working-directory: ./devops-tcs # Ruta relativa a la carpeta del proyecto
        run: |
          docker build -t registrai.azurecr.io/devops-tcs-api:latest .
          docker push registrai.azurecr.io/devops-tcs-api:latest
